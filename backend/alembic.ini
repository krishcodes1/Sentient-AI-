# Alembic configuration for SentientAI.
#
# The actual database URL is read from the DATABASE_URL environment
# variable inside ``alembic/env.py`` — leave ``sqlalchemy.url`` blank
# here so that we never accidentally point production at a dev DB.

[alembic]
# Path to migration scripts.
script_location = alembic

# Template used when generating migration files.
# We embed the date in the filename so they sort chronologically.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s

# Timezone for ``file_template`` and migration script ``Date`` headers.
timezone = UTC

# Max length of the slug derived from the migration message.
truncate_slug_length = 40

# Run env.py with each ``alembic revision`` (default behaviour) — leaving
# explicit so future contributors don't get surprised.
revision_environment = false

# Don't allow sourceless (.pyc-only) migrations.
sourceless = false

# Versions live in a single directory.
version_locations = %(here)s/alembic/versions

# Filesystem path separator used by ``version_locations``.
version_path_separator = os

# Output encoding.
output_encoding = utf-8

# Database URL — intentionally blank, populated from env in env.py.
sqlalchemy.url =


# ── Logging ──────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
