[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers --tb=short
markers =
    integration: integration tests that require Postgres/Redis (skip in unit-only runs)
    slow: slow tests
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
