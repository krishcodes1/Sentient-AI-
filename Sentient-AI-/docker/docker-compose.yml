# Runs the development stack: Postgres, Redis, the backend `dev` image (uvicorn --reload
# over a bind-mounted ../backend) and the frontend `dev` image (Vite over ../frontend),
# with all four ports published on the host.
#
# Why it exists: it is the one stack that `docker compose up` and the double-click
# installer (installer/bootstrap.py) both build, so contributors and new owners run the
# same containers; docker-compose.prod.yml is the separate hardened variant.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: sentientai
      POSTGRES_PASSWORD: sentientai
      POSTGRES_DB: sentientai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentientai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ───────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentientai:sentientai@db:5432/sentientai
      REDIS_URL: redis://redis:6379/0
      # Marks this as a container so the "See my screen" capability reports
      # unavailable instead of failing (backend/services/capabilities/env.py).
      CRAWLER_CONTAINER: "1"
      # The frontend's Vite proxy rewrites Host to its target (changeOrigin),
      # so /api requests arrive as `backend:8000`; without the service name
      # here TrustedHostMiddleware answers every one with 400 "Invalid host
      # header". This replaces any ALLOWED_HOSTS in backend/.env for this
      # stack; localhost/127.0.0.1 keep the published :8000 port working.
      ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  # ── Frontend (Vite dev; see docker-compose.prod.yml for nginx) ──
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      # Seeded from the image only when first created, then reused; the dev
      # image's entrypoint reinstalls into it when package-lock.json changes
      # (see Dockerfile.frontend).
      - /app/node_modules

volumes:
  pgdata:
