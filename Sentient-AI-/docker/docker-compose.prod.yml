# Runs the production stack: Postgres and Redis reachable only inside the compose network,
# the backend `prod` image behind its container healthcheck, and nginx serving the built
# frontend with the /api proxy on host port 3000.
#
# Why it exists: it keeps every setting that must differ from the dev compose (no reload,
# no bind mounts, unpublished datastores, a required POSTGRES_PASSWORD, graceful stop,
# log rotation) in a separate file so the hardening cannot be lost by editing the dev one.
#
# Production deployment.
#
#   cd docker
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Differences from the dev compose (docker-compose.yml):
#   - backend/frontend build their `prod` image targets: no --reload, no
#     source bind mounts, backend runs as a non-root user
#   - frontend is the static `npm run build` output served by nginx,
#     which reverse-proxies /api to the backend service
#   - Postgres and Redis are NOT published to the host (internal only)
#   - backend has a container healthcheck; frontend waits for it
#
# POSTGRES_PASSWORD is REQUIRED (set it in the environment or a
# docker/.env file) — compose refuses to start without it rather than
# silently deploying a publicly-known default password.
#
# ALLOWED_HOSTS (backend/.env) must list the public hostname(s) people
# browse to, e.g. ["assistant.example.com"]. nginx forwards the client's
# Host header to the backend unchanged, and the backend answers any Host
# not on the list with 400 "Invalid host header" — add "localhost" too if
# you smoke-test through http://localhost:3000. Don't use ["*"]: it turns
# the check off.
#
# TLS: nothing in this stack terminates TLS. Do not expose port 3000 to
# the internet directly — put a TLS-terminating reverse proxy (Caddy,
# Traefik, nginx with certbot, or a cloud load balancer) in front of the
# frontend service. See the README's "Production deployment" section.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: sentientai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or docker/.env before deploying}
      POSTGRES_DB: sentientai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentientai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI, non-root, no reload) ──────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
      target: prod
    restart: unless-stopped
    <<: *logging
    # Give in-flight agent turns time to finish and persist on redeploy;
    # uvicorn runs with --timeout-graceful-shutdown 55 (Dockerfile.backend).
    stop_grace_period: 60s
    # NOT published to the host: nginx (frontend service) is the only entry
    # point. Publishing 8000 directly would bypass the proxy that overwrites
    # X-Forwarded-For — reopening the rate-limit spoof the trusted-proxy
    # design exists to close — and expose a second, unmanaged plaintext API.
    expose:
      - "8000"
    env_file:
      - ../backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://sentientai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or docker/.env before deploying}@db:5432/sentientai
      REDIS_URL: redis://redis:6379/0
      # Marks this as a container so the "See my screen" capability reports
      # unavailable instead of failing (backend/services/capabilities/env.py).
      CRAWLER_CONTAINER: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sends a Host from ALLOWED_HOSTS; see the script in Dockerfile.backend.
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Frontend (nginx serving the static build, /api proxy) ───────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: prod
    restart: unless-stopped
    <<: *logging
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
