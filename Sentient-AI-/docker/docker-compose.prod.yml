# Production deployment.
#
#   cd docker
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Differences from the dev compose (docker-compose.yml):
#   - backend/frontend build their `prod` image targets: no --reload, no
#     source bind mounts, backend runs as a non-root user
#   - frontend is the static `npm run build` output served by nginx,
#     which reverse-proxies /api to the backend service
#   - Postgres and Redis are NOT published to the host (internal only)
#   - backend has a container healthcheck; frontend waits for it
#
# Set POSTGRES_PASSWORD in the environment (or a docker/.env file) to
# override the default database password before deploying.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentientai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentientai}
      POSTGRES_DB: sentientai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentientai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI, non-root, no reload) ──────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
      target: prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://sentientai:${POSTGRES_PASSWORD:-sentientai}@db:5432/sentientai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Frontend (nginx serving the static build, /api proxy) ───────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
