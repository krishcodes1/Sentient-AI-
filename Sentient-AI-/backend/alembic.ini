# Alembic configuration for the Crawler AI backend.
#
# Run from this directory (backend/):
#     alembic upgrade head
#
# Note there is deliberately no `sqlalchemy.url` here. The database URL —
# which carries credentials — comes from the application's own settings
# (core.config.Settings.DATABASE_URL, i.e. the DATABASE_URL environment
# variable / .env), resolved in alembic/env.py. That keeps migrations and
# the running app pointed at exactly one database and keeps secrets out of
# a file that is committed to the repository. Set `sqlalchemy.url` below
# only for a one-off run against some other database.

[alembic]
script_location = alembic

# Revision filenames: 0001_baseline_schema.py rather than an opaque hash,
# so the history reads in order on disk.
file_template = %%(rev)s_%%(slug)s

# backend/ on sys.path so env.py can import `core` and `models`.
# path_separator is ignored by alembic < 1.16 and silences its deprecation
# warning on newer versions.
path_separator = os
prepend_sys_path = .

# Timestamps in migration files use the local timezone of whoever ran
# `alembic revision`; leave unset to keep the default (naive local time).

[post_write_hooks]

# ── Logging ───────────────────────────────────────────────────────────────
# Only applied when alembic is driven from the command line; programmatic
# callers (the test suite) set `configure_logger = False` on the Config so
# migrations never hijack the host process's logging setup.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
