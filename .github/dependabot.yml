version: 2
updates:
  - package-ecosystem: pip
    directory: "/Sentient-AI-/backend"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/Sentient-AI-/frontend"
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint only accepts TypeScript < 6.1; newer breaks npm ci.
      # Remove once typescript-eslint's peer range allows it.
      - dependency-name: "typescript"
        versions: [">=6.1"]
  - package-ecosystem: docker
    directory: "/Sentient-AI-/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
