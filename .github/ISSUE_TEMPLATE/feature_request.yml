name: Feature request
description: Propose a new feature or enhancement for SentientAI.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an idea. Focus on **the problem** before the
        solution — that helps us evaluate alternatives.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One sentence describing the feature.
      placeholder: "Add per-user rate limiting on agent endpoints"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who is affected? What are they doing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you'd like. Include rough UX, API shape, or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they don't fit as well.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Backend (FastAPI)
        - Frontend (React/Vite)
        - Agent / OpenClaw
        - Database / migrations
        - Docker / deploy
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your assessment)
      options:
        - "Nice to have"
        - "Should have"
        - "Must have / blocking"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references, related issues.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
